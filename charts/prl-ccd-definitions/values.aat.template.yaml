prl-cos:
  enabled: true
  java:
    image: hmctsprod.azurecr.io/prl/cos:latest
    ingressHost: ${SERVICE_FQDN}
    environment:
      PAY_CALLBACK_URL: https://${SERVICE_FQDN}/service-request-update
      IDAM_CLIENT_REDIRECT_URI: https://${SERVICE_FQDN}/oauth2/callback
      PRL_S2S_AUTHORISED_SERVICES: api_gw,prl_citizen_frontend,fis_hmc_api,ccd_data,prl_cos_api
      APP_ENV: "aat"
      FACT_V2_ENABLED: true
      FACT_V2_API_URL: https://cft-api-mgmt.aat.platform.hmcts.net/fact
      FACT_V2_SCOPE: api://6e2a7c9e-0634-4846-8a8e-0af598d905b0/.default
    keyVaults:
      central-app-reg-kv:
        excludeEnvironmentSuffix: true
        secrets:
          - name: tenant-id
            alias: FACT_V2_TENANT_ID
          - name: prl-cos-api-non-prod-app-id
            alias: FACT_V2_CLIENT_ID
          - name: prl-cos-api-non-prod-secret
            alias: FACT_V2_CLIENT_SECRET
